<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>ÉtudIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<style>
  :root{
    --cream:#FEFCF9;
    --text:#4A4638;
    --text-soft:#9C9484;
    --text-faint:#B0A996;
    --purple:#A78BFA;
    --input-bg:#FBF8F3;
    --card-shadow: 0 8px 20px -8px rgba(0,0,0,0.08);
    --modal-shadow: 0 20px 60px -20px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Nunito', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height:100vh;
  }
  .display{ font-family:'Quicksand', sans-serif; }
  .wrap{ max-width: 640px; margin:0 auto; padding: 24px 20px 60px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand img{ width:48px; height:48px; border-radius:16px; }
  .brand h1{ font-size:22px; margin:0; }
  .gear-btn{
    width:42px; height:42px; border-radius:999px; border:none; background:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow: var(--card-shadow); transition: background .15s;
  }
  .gear-btn.active{ background: var(--purple); }
  .gear-btn svg{ stroke:#9C9484; }
  .gear-btn.active svg{ stroke:#fff; }

  .subtitle{ color: var(--text-soft); margin: 10px 0 26px; font-size:15px; }

  .grid{ display:grid; grid-template-columns: 1fr 1fr; gap:16px; }

  .child-card{
    position:relative; border-radius:26px; padding:22px 18px; text-align:center;
    box-shadow: var(--card-shadow); cursor:pointer; border:none;
    transition: transform .15s ease;
  }
  .child-card:active{ transform: scale(0.97); }
  .child-emoji{
    width:64px; height:64px; border-radius:999px; background:rgba(255,255,255,0.6);
    display:flex; align-items:center; justify-content:center; font-size:30px; margin:0 auto 10px;
  }
  .child-name{ font-weight:700; font-size:17px; display:block; }
  .child-meta{ font-size:12px; color:#6B6558; font-weight:700; display:block; margin-top:4px; }

  .child-gear{
    position:absolute; top:10px; right:10px; width:28px; height:28px; border-radius:999px;
    background: rgba(255,255,255,0.75); border:none; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }

  .add-card{
    border-radius:26px; padding:22px 18px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:6px; border:2px dashed #D9D2C4; background:none; cursor:pointer; color:#B0A996;
    min-height:132px;
  }
  .add-card .plus{ font-size:26px; line-height:1; }
  .add-card span.label{ font-size:13px; font-weight:700; }

  .empty-state{ text-align:center; padding: 50px 10px; }
  .empty-state .emoji{ font-size:48px; margin-bottom:14px; }
  .empty-state h2{ font-size:18px; margin:0 0 6px; }
  .empty-state p{ color: var(--text-soft); font-size:14px; margin:0 0 22px; }
  .btn-primary{
    background: var(--purple); color:#fff; border:none; border-radius:999px;
    padding: 12px 22px; font-family:'Quicksand',sans-serif; font-weight:700; font-size:14px; cursor:pointer;
  }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.22); display:flex; align-items:flex-end;
    justify-content:center; padding: 0 16px; z-index:30;
  }
  @media (min-width:520px){ .overlay{ align-items:center; } }
  .modal{
    width:100%; max-width:440px; background:#fff; border-radius:26px 26px 0 0; padding:24px;
    box-shadow: var(--modal-shadow); max-height:88vh; overflow-y:auto;
  }
  @media (min-width:520px){ .modal{ border-radius:26px; } }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .modal-head h3{ margin:0; font-size:18px; }
  .close-btn{ background:#F5F2EC; border:none; width:30px; height:30px; border-radius:999px; cursor:pointer; }

  label.field-label{
    display:block; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.03em;
    color: var(--text-faint); margin-bottom:6px;
  }
  .field{ margin-bottom:16px; }
  input[type=text], input[type=number], select{
    width:100%; border:none; background: var(--input-bg); border-radius:14px; padding:11px 14px;
    font-size:14px; font-family:'Nunito',sans-serif; outline:none; color:var(--text);
  }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .style-tags{ display:flex; flex-wrap:wrap; gap:8px; }
  .tag{
    padding:7px 13px; border-radius:999px; font-size:12px; font-weight:700; cursor:pointer;
    background:#F5F2EC; color:#9C9484; border:none; font-family:'Nunito',sans-serif;
  }
  .tag.active{ background: var(--purple); color:#fff; }

  .swatches{ display:flex; gap:10px; flex-wrap:wrap; }
  .swatch{
    width:34px; height:34px; border-radius:999px; border:none; cursor:pointer; padding:0;
  }
  .swatch.active{ outline:2px solid #4A4638; outline-offset:2px; }

  .emoji-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .emoji-opt{
    width:40px; height:40px; border-radius:12px; border:none; background:#F5F2EC; font-size:18px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .emoji-opt.active{ background: var(--purple); }

  .btn-block{
    width:100%; border:none; border-radius:16px; padding:13px; font-family:'Quicksand',sans-serif;
    font-weight:700; font-size:14px; cursor:pointer; margin-top:4px;
  }
  .btn-save{ background: var(--purple); color:#fff; }
  .btn-danger{ background:#F8E7E0; color:#B5674A; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:10px; }

  /* Espace enfant (placeholder pour la suite) */
  .child-space{ text-align:center; padding: 60px 20px; color: var(--text-soft); }
  .back-link{
    display:inline-flex; align-items:center; gap:6px; background:none; border:none; color:var(--text-soft);
    font-family:'Nunito',sans-serif; font-size:14px; cursor:pointer; margin-bottom:20px;
  }

  /* Chapitres */
  .chapter-row{
    display:flex; align-items:center; justify-content:space-between; background:#fff; border-radius:18px;
    padding:14px 16px; margin-bottom:12px; box-shadow: var(--card-shadow);
  }
  .chapter-info{ display:flex; align-items:center; gap:14px; flex:1; text-align:left; background:none; border:none; cursor:pointer; padding:0; }
  .chapter-name{ font-weight:700; font-size:15px; color:var(--text); display:block; }
  .status-badge{ display:inline-block; font-size:11px; font-weight:800; padding:3px 10px; border-radius:999px; margin-top:4px; }
  .chapter-gear{
    width:32px; height:32px; border-radius:999px; background:#F5F2EC; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-left:8px;
  }

  /* Import + tabs */
  .import-block{
    border-radius:22px; padding:16px; margin-bottom:18px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:12px; background:#F5F2EC;
  }
  .import-btn{
    display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:999px; border:none;
    background:rgba(255,255,255,0.85); font-size:13px; font-weight:700; cursor:pointer; font-family:'Nunito',sans-serif;
  }
  .analyse-btn{ color:#fff; }
  .tabs{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .tab-btn{
    display:flex; align-items:center; gap:6px; padding:9px 14px; border-radius:999px; border:none;
    background:#fff; color:var(--text-soft); font-size:13px; font-weight:700; cursor:pointer; font-family:'Nunito',sans-serif;
    box-shadow: var(--card-shadow);
  }
  .tab-btn.active{ background: var(--purple); color:#fff; }
  .tab-content{
    background:#fff; border-radius:22px; padding:22px; box-shadow: var(--card-shadow); font-size:14px; color:#6B6558;
    min-height:120px;
  }
</style>
</head>

const db = firebase.firestore();
const storage = firebase.storage();

/* Collection temporaire "enfants" à la racine, en attendant l'espace famille (email+code) */
const enfantsRef = db.collection("enfants");

let children = [];
let settingsMode = false;
let editingId = null; // null = fermé, "new" = création, sinon id enfant
let formStyles = [];
let formColor = COLORS[0];
let formEmoji = EMOJIS[0];

/* Synchronisation temps réel avec Firestore */
enfantsRef.onSnapshot(
  (snapshot) => {
    children = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    render();
  },
  (error) => {
    console.error("Erreur de connexion Firestore :", error);
    document.getElementById("childrenArea").innerHTML =
      '<p style="color:#B5674A; font-size:14px;">Impossible de se connecter à la base de données. Vérifie ta connexion internet.</p>';
  }
);

/* ---------- Rendu écran liste ---------- */
function render(){
  const area = document.getElementById("childrenArea");
  document.getElementById("subtitleText").textContent = settingsMode
    ? "Modifie un profil ou ajoutes-en un nouveau"
    : "Pour qui on révise aujourd'hui ?";

  if(children.length === 0 && !settingsMode){
    area.innerHTML = `
      <div class="empty-state">
        <div class="emoji">🗂️</div>
        <h2 class="display">Pas encore de profil</h2>
        <p>Crée le premier profil pour commencer à réviser</p>
        <button class="btn-primary display" onclick="openEditor('new')">+ Créer un profil</button>
      </div>`;
    return;
  }

  let html = '<div class="grid">';
  children.forEach(c => {
    html += `
      <button class="child-card" style="background:${c.color}" onclick="${settingsMode ? `openEditor('${c.id}')` : `openChild('${c.id}')`}">
        ${settingsMode ? `<span class="child-gear" onclick="event.stopPropagation(); openEditor('${c.id}')">⚙️</span>` : ""}
        <div class="child-emoji">${c.emoji}</div>
        <span class="child-name display">${escapeHtml(c.name || "Sans nom")}</span>
        ${settingsMode ? `<span class="child-meta">${c.classe || "—"} ${c.age ? "· " + c.age + " ans" : ""}</span>` : ""}
      </button>`;
  });
  html += `
      <button class="add-card" onclick="openEditor('new')">
        <span class="plus">+</span>
        <span class="label">Ajouter</span>
      </button>
    </div>`;
  area.innerHTML = html;
}

function toggleSettings(){
  settingsMode = !settingsMode;
  document.getElementById("settingsToggle").classList.toggle("active", settingsMode);
  render();
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

/* ---------- Navigation vers l'espace enfant : matières ---------- */
let currentChildId = null;
let subjects = [];
let subjectsUnsubscribe = null;
let settingsModeSubjects = false;
let editingSubjectId = null; // null | "new" | subject id
let subjectFormColor = COLORS[0];
let subjectFormEmoji = SUBJECT_EMOJIS[0];

function openChild(id){
  const c = children.find(x => x.id === id);
  if(!c) return;
  currentChildId = id;

  document.getElementById("screen-children").style.display = "none";
  document.getElementById("screen-space").style.display = "block";
  document.getElementById("spaceEmoji").textContent = c.emoji;
  document.getElementById("spaceName").textContent = c.name;

  subjects = [];
  renderSubjects();

  if(subjectsUnsubscribe) subjectsUnsubscribe();
  subjectsUnsubscribe = enfantsRef.doc(id).collection("matieres").onSnapshot(
    (snapshot) => {
      subjects = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderSubjects();
    },
    (error) => {
      console.error("Erreur de connexion Firestore (matières) :", error);
      document.getElementById("subjectsArea").innerHTML =
        '<p style="color:#B5674A; font-size:14px;">Impossible de charger les matières.</p>';
    }
  );
}

function goHome(){
  if(subjectsUnsubscribe){ subjectsUnsubscribe(); subjectsUnsubscribe = null; }
  currentChildId = null;
  document.getElementById("screen-space").style.display = "none";
  document.getElementById("screen-children").style.display = "block";
}

/* ---------- Rendu écran matières ---------- */
function renderSubjects(){
  const area = document.getElementById("subjectsArea");

  if(subjects.length === 0){
    document.getElementById("spaceSubtitle").style.display = "none";
    area.innerHTML = `
      <div class="empty-state">
        <div class="emoji">🗂️</div>
        <h2 class="display">Pas encore de matière</h2>
        <p>Crée une première carte pour ${escapeHtml(children.find(c=>c.id===currentChildId)?.name || "")}</p>
        <button class="btn-primary display" onclick="openSubjectEditor('new')">+ Créer une carte</button>
      </div>`;
    return;
  }

  document.getElementById("spaceSubtitle").style.display = "block";
  let html = '<div class="grid">';
  subjects.forEach(s => {
    html += `
      <div class="child-card" style="background:${s.color}; text-align:left; display:flex; flex-direction:column; align-items:flex-start; gap:12px;">
        <button class="child-gear" onclick="openSubjectEditor('${s.id}')">⚙️</button>
        <button onclick="openSubject('${s.id}')" style="all:unset; cursor:pointer; display:flex; flex-direction:column; gap:10px; width:100%;">
          <div style="width:42px; height:42px; border-radius:14px; background:rgba(255,255,255,0.7); display:flex; align-items:center; justify-content:center; font-size:20px;">${s.icon}</div>
          <span class="display" style="font-weight:700; color:#4A4638;">${escapeHtml(s.name || "Sans nom")}</span>
        </button>
      </div>`;
  });
  html += `
      <button class="add-card" onclick="openSubjectEditor('new')">
        <span class="plus">+</span>
        <span class="label">Ajouter</span>
      </button>
    </div>`;
  area.innerHTML = html;
}

let currentSubjectId = null;
let chapters = [];
let chaptersUnsubscribe = null;
let editingChapterId = null; // null | "new" | chapter id
let currentChapterId = null;
let currentTab = "lecon";
let importState = null; // null | "ready" | "analyzing" | "done"

function chaptersRefFor(childId, subjectId){
  return enfantsRef.doc(childId).collection("matieres").doc(subjectId).collection("chapitres");
}

function openSubject(id){
  const s = subjects.find(x => x.id === id);
  if(!s) return;
  currentSubjectId = id;

  document.getElementById("screen-space").style.display = "none";
  document.getElementById("screen-chapters").style.display = "block";
  document.getElementById("chaptersSubjectName").textContent = s.name;
  document.getElementById("chaptersIcon").textContent = s.icon;
  document.getElementById("chaptersIcon").style.background = s.color;

  chapters = [];
  renderChapters();

  if(chaptersUnsubscribe) chaptersUnsubscribe();
  chaptersUnsubscribe = chaptersRefFor(currentChildId, id).onSnapshot(
    (snapshot) => {
      chapters = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderChapters();
    },
    (error) => {
      console.error("Erreur de connexion Firestore (chapitres) :", error);
      document.getElementById("chaptersArea").innerHTML =
        '<p style="color:#B5674A; font-size:14px;">Impossible de charger les chapitres.</p>';
    }
  );
}

function goSubjects(){
  if(chaptersUnsubscribe){ chaptersUnsubscribe(); chaptersUnsubscribe = null; }
  currentSubjectId = null;
  document.getElementById("screen-chapters").style.display = "none";
  document.getElementById("screen-space").style.display = "block";
}

const STATUS_LABELS = {
  en_cours: { label: "En cours", color:"#B08328", bg:"#FCF1DA" },
  termine: { label: "Terminé", color:"#4C8B57", bg:"#E3F2E5" },
};

function renderChapters(){
  const area = document.getElementById("chaptersArea");
  if(chapters.length === 0){
    area.innerHTML = `
      <div class="empty-state">
        <div class="emoji">📚</div>
        <h2 class="display">Pas encore de chapitre</h2>
        <p>Clique sur "Nouveau chapitre" pour commencer</p>
      </div>`;
    return;
  }
  area.innerHTML = chapters.map(ch => {
    const st = STATUS_LABELS[ch.status] || STATUS_LABELS.en_cours;
    return `
      <div class="chapter-row">
        <button class="chapter-info" onclick="openChapter('${ch.id}')">
          <div>
            <span class="chapter-name">${escapeHtml(ch.title)}</span>
            <span class="status-badge" style="color:${st.color}; background:${st.bg};">${st.label}</span>
          </div>
        </button>
        <button class="chapter-gear" onclick="openChapterEditor('${ch.id}')">⚙️</button>
      </div>`;
  }).join("");
}

/* ---------- Editeur chapitre (creation directe avec renommage) ---------- */
function openChapterEditor(id){
  editingChapterId = id;
  const isNew = id === "new";
  const ch = isNew ? null : chapters.find(x => x.id === id);

  document.getElementById("chapterEditorTitle").textContent = isNew ? "Nouveau chapitre" : "Modifier le chapitre";
  document.getElementById("ch-name").value = ch ? ch.title : "";
  document.getElementById("chapterSaveBtn").textContent = isNew ? "Créer le chapitre" : "Enregistrer";
  document.getElementById("chapterDeleteBtn").style.display = isNew ? "none" : "flex";
  document.getElementById("chapterOverlay").style.display = "flex";
}
function closeChapterEditor(){
  document.getElementById("chapterOverlay").style.display = "none";
  editingChapterId = null;
}

function saveChapter(){
  const title = document.getElementById("ch-name").value.trim();
  if(!title){ alert("Donne un nom au chapitre avant de continuer 🙂"); return; }

  const ref = chaptersRefFor(currentChildId, currentSubjectId);
  const saveBtn = document.getElementById("chapterSaveBtn");
  saveBtn.textContent = "Enregistrement...";
  saveBtn.disabled = true;

  const isNew = editingChapterId === "new";
  const request = isNew
    ? ref.add({ title, status: "en_cours", createdAt: firebase.firestore.FieldValue.serverTimestamp() })
    : ref.doc(editingChapterId).update({ title });

  request
    .then((docRef) => {
      closeChapterEditor();
      if(isNew){
        // On entre directement dans le chapitre, prêt à scanner
        openChapter(docRef.id, true);
      }
    })
    .catch((err) => {
      console.error(err);
      alert("Oups, l'enregistrement a échoué. Vérifie ta connexion et réessaie.");
    })
    .finally(() => {
      saveBtn.disabled = false;
    });
}

function deleteChapter(){
  if(!confirm("Supprimer ce chapitre ? Son contenu sera perdu.")) return;
  chaptersRefFor(currentChildId, currentSubjectId).doc(editingChapterId).delete()
    .then(() => closeChapterEditor())
    .catch((err) => {
      console.error(err);
      alert("Oups, la suppression a échoué.");
    });
}

/* ---------- Ecran contenu d'un chapitre ---------- */
function openChapter(id, justCreated){
  currentChapterId = id;
  currentTab = "lecon";
  importState = justCreated ? "ready" : null;

  document.getElementById("screen-chapters").style.display = "none";
  document.getElementById("screen-chapter").style.display = "block";
  const ch = chapters.find(c => c.id === id);
  document.getElementById("chapterTitle").textContent = ch ? ch.title : "";

  renderImportBlock();
  renderTabs();
  renderTabContent();
}

function goChapters(){
  currentChapterId = null;
  document.getElementById("screen-chapter").style.display = "none";
  document.getElementById("screen-chapters").style.display = "block";
}

function renderImportBlock(){
  const box = document.getElementById("importBlock");
  const s = subjects.find(x => x.id === currentSubjectId);
  const accent = s ? s.color : "#EAE1F5";

  if(importState === "done"){
    box.innerHTML = `<span style="font-weight:800; color:#4C8B57; font-size:14px;">✅ Document analysé, contenu généré</span>`;
    return;
  }
  box.innerHTML = `
    <div style="display:flex; gap:8px; justify-content:center; width:100%;">
      <button class="import-btn" onclick="setImportState('ready')">📷 Prendre en photo</button>
      <button class="import-btn" onclick="setImportState('ready')">📁 Importer un fichier</button>
    </div>
    ${importState === "ready" ? `<div style="display:flex; justify-content:center; width:100%;"><button class="import-btn analyse-btn" style="background:#A78BFA;" onclick="analyseDocument()">✨ Analyser</button></div>` : ""}
    ${importState === "analyzing" ? `<div style="display:flex; justify-content:center; width:100%;"><span style="font-weight:700; color:#9C9484; font-size:13px;">Analyse en cours...</span></div>` : ""}
  `;
}
function setImportState(s){ importState = s; renderImportBlock(); }
function analyseDocument(){
  importState = "analyzing";
  renderImportBlock();
  setTimeout(() => {
    importState = "done";
    renderImportBlock();
    // Simulation : passe le chapitre en "en cours" avec du contenu (le vrai contenu IA viendra plus tard)
  }, 1200);
}

function renderTabs(){
  const tabs = [
    { id:"lecon", label:"Leçon", icon:"📝" },
    { id:"exercices", label:"Exercices", icon:"✅" },
    { id:"qcm", label:"QCM", icon:"🔘" },
    { id:"question", label:"Une question ?", icon:"❓" },
  ];
  document.getElementById("chapterTabs").innerHTML = tabs.map(t => `
    <button class="tab-btn ${currentTab === t.id ? "active" : ""}" onclick="switchTab('${t.id}')">${t.icon} ${t.label}</button>
  `).join("");
}
function switchTab(id){ currentTab = id; renderTabs(); renderTabContent(); }

function renderTabContent(){
  const box = document.getElementById("chapterContent");
  if(currentTab === "lecon"){
    box.innerHTML = `<p>Le résumé du chapitre s'affichera ici, généré à partir des photos ajoutées — reformulé simplement, adapté à l'âge de l'enfant.</p>`;
  } else if(currentTab === "exercices"){
    box.innerHTML = `<p>Les exercices générés à partir de la leçon s'afficheront ici, un par un.</p>`;
  } else if(currentTab === "qcm"){
    box.innerHTML = `<p>Un petit QCM pour vérifier ce qui est bien acquis.</p>`;
  } else if(currentTab === "question"){
    box.innerHTML = `
      <p style="margin-bottom:12px;">Tu n'as pas compris un truc ? Pose ta question, on t'explique autrement 🌟</p>
      <div style="background:#FBF8F3; border-radius:14px; padding:12px 14px; color:#B0A996;">Écris ta question ici...</div>
    `;
  }
}

/* ---------- Editeur matière ---------- */
function openSubjectEditor(id){
  editingSubjectId = id;
  const isNew = id === "new";
  const s = isNew ? null : subjects.find(x => x.id === id);

  document.getElementById("subjectEditorTitle").textContent = isNew ? "Nouvelle carte" : "Modifier la carte";
  document.getElementById("s-name").value = s ? s.name : "";
  subjectFormColor = s ? s.color : COLORS[0];
  subjectFormEmoji = s ? s.icon : SUBJECT_EMOJIS[0];

  renderSubjectPreview();
  renderSubjectSwatches();
  renderSubjectEmojiGrid();

  document.getElementById("subjectDeleteBtn").style.display = isNew ? "none" : "flex";
  document.getElementById("subjectOverlay").style.display = "flex";
}
function closeSubjectEditor(){
  document.getElementById("subjectOverlay").style.display = "none";
  editingSubjectId = null;
}
function renderSubjectPreview(){
  const box = document.getElementById("subjectPreview");
  box.style.background = subjectFormColor;
  box.textContent = subjectFormEmoji;
}
function renderSubjectSwatches(){
  const box = document.getElementById("subjectSwatches");
  box.innerHTML = COLORS.map(col => `
    <button type="button" class="swatch ${subjectFormColor === col ? "active" : ""}" style="background:${col}" onclick="pickSubjectColor('${col}')"></button>
  `).join("");
}
function pickSubjectColor(c){ subjectFormColor = c; renderSubjectSwatches(); renderSubjectPreview(); }

function renderSubjectEmojiGrid(){
  const box = document.getElementById("subjectEmojiGrid");
  box.innerHTML = SUBJECT_EMOJIS.map(e => `
    <button type="button" class="emoji-opt ${subjectFormEmoji === e ? "active" : ""}" onclick="pickSubjectEmoji('${e}')">${e}</button>
  `).join("");
}
function pickSubjectEmoji(e){ subjectFormEmoji = e; renderSubjectEmojiGrid(); renderSubjectPreview(); }

function saveSubject(){
  const name = document.getElementById("s-name").value.trim();
  if(!name){ alert("Donne un nom à la carte avant d'enregistrer 🙂"); return; }

  const data = { name, color: subjectFormColor, icon: subjectFormEmoji };
  const subjectsRef = enfantsRef.doc(currentChildId).collection("matieres");

  const saveBtn = document.querySelector("#subjectOverlay .btn-save");
  saveBtn.textContent = "Enregistrement...";
  saveBtn.disabled = true;

  const request = editingSubjectId === "new"
    ? subjectsRef.add(data)
    : subjectsRef.doc(editingSubjectId).update(data);

  request
    .then(() => { closeSubjectEditor(); })
    .catch((err) => {
      console.error(err);
      alert("Oups, l'enregistrement a échoué. Vérifie ta connexion et réessaie.");
    })
    .finally(() => {
      saveBtn.textContent = "Enregistrer";
      saveBtn.disabled = false;
    });
}

function deleteSubject(){
  if(!confirm("Supprimer cette carte matière ? Les chapitres qu'elle contient seront perdus.")) return;
  enfantsRef.doc(currentChildId).collection("matieres").doc(editingSubjectId).delete()
    .then(() => closeSubjectEditor())
    .catch((err) => {
      console.error(err);
      alert("Oups, la suppression a échoué.");
    });
}

/* ---------- Editeur profil ---------- */
function openEditor(id){
  editingId = id;
  const isNew = id === "new";
  const c = isNew ? null : children.find(x => x.id === id);

  document.getElementById("editorTitle").textContent = isNew ? "Nouveau profil" : "Modifier le profil";
  document.getElementById("f-name").value = c ? c.name : "";
  document.getElementById("f-age").value = c ? c.age : "";
  document.getElementById("f-classe").value = c ? (c.classe || "") : "";
  formStyles = c ? [...(c.styles || [])] : [];
  formColor = c ? c.color : COLORS[0];
  formEmoji = c ? c.emoji : EMOJIS[0];

  renderStyleTags();
  renderSwatches();
  renderEmojiGrid();

  document.getElementById("resetBtn").style.display = isNew ? "none" : "flex";
  document.getElementById("editorOverlay").style.display = "flex";
}
function closeEditor(){
  document.getElementById("editorOverlay").style.display = "none";
  editingId = null;
}

function renderStyleTags(){
  const box = document.getElementById("styleTags");
  box.innerHTML = LEARNING_STYLES.map(s => `
    <button type="button" class="tag ${formStyles.includes(s.id) ? "active" : ""}" onclick="toggleStyle('${s.id}')">${s.label}</button>
  `).join("");
}
function toggleStyle(id){
  formStyles = formStyles.includes(id) ? formStyles.filter(s => s !== id) : [...formStyles, id];
  renderStyleTags();
}

function renderSwatches(){
  const box = document.getElementById("swatches");
  box.innerHTML = COLORS.map(col => `
    <button type="button" class="swatch ${formColor === col ? "active" : ""}" style="background:${col}" onclick="pickColor('${col}')"></button>
  `).join("");
}
function pickColor(c){ formColor = c; renderSwatches(); }

function renderEmojiGrid(){
  const box = document.getElementById("emojiGrid");
  box.innerHTML = EMOJIS.map(e => `
    <button type="button" class="emoji-opt ${formEmoji === e ? "active" : ""}" onclick="pickEmoji('${e}')">${e}</button>
  `).join("");
}
function pickEmoji(e){ formEmoji = e; renderEmojiGrid(); }

function saveChild(){
  const name = document.getElementById("f-name").value.trim();
  if(!name){ alert("Donne un prénom au profil avant d'enregistrer 🙂"); return; }

  const data = {
    name,
    age: document.getElementById("f-age").value,
    classe: document.getElementById("f-classe").value,
    styles: formStyles,
    color: formColor,
    emoji: formEmoji,
  };

  const saveBtn = document.querySelector(".btn-save");
  saveBtn.textContent = "Enregistrement...";
  saveBtn.disabled = true;

  const request = editingId === "new"
    ? enfantsRef.add(data)
    : enfantsRef.doc(editingId).update(data);

  request
    .then(() => { closeEditor(); })
    .catch((err) => {
      console.error(err);
      alert("Oups, l'enregistrement a échoué. Vérifie ta connexion et réessaie.");
    })
    .finally(() => {
      saveBtn.textContent = "Enregistrer";
      saveBtn.disabled = false;
    });
}

function resetChildData(){
  if(!confirm("Réinitialiser ce profil pour la nouvelle année ? Le contenu scolaire (matières, chapitres) sera effacé, mais le profil (nom, âge, style d'apprentissage) est conservé.")) return;
  // Le contenu (matières/chapitres) sera géré à l'étape suivante du développement.
  // Ici on efface uniquement les futures données liées à cet enfant si elles existent.
  localStorage.removeItem("etudia_subjects_" + editingId);
  closeEditor();
  alert("C'est fait — le contenu scolaire de ce profil a été réinitialisé.");
}

render();
</script>
